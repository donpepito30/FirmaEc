<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Full Bleed for PWA Maskable) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Shield Bevel / Specular Highlight -->
    <linearGradient id="shieldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gold Checkmark & Key Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Tech Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.5"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Full Bleed Background (512x512) - Fills Maskable Area on Android/iOS -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- 2. Ambient Tech Circuit Grid Lines in Background -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.35">
    <circle cx="256" cy="240" r="210" fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.5"/>
    <circle cx="256" cy="240" r="175" fill="none" stroke-dasharray="8,8"/>
    <line x1="256" y1="20" x2="256" y2="70"/>
    <line x1="256" y1="410" x2="256" y2="460"/>
    <line x1="20" y1="240" x2="70" y2="240"/>
    <line x1="410" y1="240" x2="460" y2="240"/>
  </g>

  <!-- 3. Security Shield (Scaled within PWA Safe Zone) -->
  <g filter="url(#shieldShadow)">
    <!-- Base Shield -->
    <path d="M 256,105 
             C 330,105 368,122 378,138 
             C 378,268 294,342 256,375 
             C 218,342 134,268 134,138 
             C 144,122 182,105 256,105 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Inner Shield Bevel / Contour -->
    <path d="M 256,122 
             C 318,122 350,136 358,149 
             C 358,256 288,320 256,348 
             C 224,320 154,256 154,149 
             C 162,136 194,122 256,122 Z" 
          fill="none" 
          stroke="url(#shieldHighlight)" 
          stroke-width="5"/>

    <!-- Top Key Lock / Cryptographic Node Detail -->
    <circle cx="256" cy="168" r="18" fill="url(#cyanGrad)"/>
    <circle cx="256" cy="168" r="8" fill="#0f172a"/>

    <!-- Gold Verification Checkmark -->
    <path d="M 198,238 L 242,282 L 322,188" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#goldGlow)"/>

    <!-- Specular highlight dot on checkmark elbow -->
    <circle cx="322" cy="188" r="10" fill="#fef08a"/>
  </g>

  <!-- 4. Bottom "EC PRO" Official Security Seal Badge -->
  <g transform="translate(0, 5)">
    <rect x="176" y="398" width="160" height="34" rx="17" 
          fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shieldShadow)"/>
    
    <text x="256" y="420" 
          font-family="'Plus Jakarta Sans', 'Space Grotesk', system-ui, sans-serif" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#f8fafc" 
          text-anchor="middle">FIRMA<tspan fill="#fbbf24">EC</tspan> PRO</text>
  </g>
</svg>
