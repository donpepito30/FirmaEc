<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Shield / Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Emerald Check Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Base with rounded corners (squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Subtle Shield / Security Background Motif -->
  <path d="M 256 64 C 320 64 384 80 384 80 L 384 240 C 384 340 310 400 256 432 C 202 400 128 340 128 240 L 128 80 C 128 80 192 64 256 64 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Document Sheet -->
  <g filter="url(#glow)">
    <path d="M 160 120 L 300 120 L 352 172 L 352 380 C 352 393.2 341.2 404 328 404 L 160 404 C 146.8 404 136 393.2 136 380 L 136 144 C 136 130.8 146.8 120 160 120 Z" fill="#ffffff"/>
    <!-- Folded Corner -->
    <path d="M 300 120 L 300 172 L 352 172 Z" fill="#cbd5e1"/>
  </g>

  <!-- Document Text lines -->
  <rect x="172" y="160" width="100" height="12" rx="6" fill="#94a3b8"/>
  <rect x="172" y="190" width="140" height="12" rx="6" fill="#cbd5e1"/>
  <rect x="172" y="220" width="120" height="12" rx="6" fill="#cbd5e1"/>

  <!-- Ecuador Flag Ribbon Badge (Top-Right of Document) -->
  <g transform="translate(310, 110)">
    <rect x="0" y="0" width="28" height="6" fill="#facc15"/>
    <rect x="0" y="6" width="28" height="3" fill="#2563eb"/>
    <rect x="0" y="9" width="28" height="3" fill="#ef4444"/>
  </g>

  <!-- Digital Signature Checkmark Shield Badge (Foreground) -->
  <g filter="url(#glow)">
    <circle cx="288" cy="308" r="76" fill="#0f172a" stroke="#3b82f6" stroke-width="6"/>
    <circle cx="288" cy="308" r="64" fill="url(#blueGrad)"/>
    
    <!-- Signature / Verification Checkmark -->
    <path d="M 252 308 L 276 332 L 328 280" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- PKI Lock Badge (Bottom-Left of Document) -->
  <g transform="translate(160, 260)">
    <rect x="0" y="24" width="48" height="36" rx="8" fill="url(#goldGrad)"/>
    <path d="M 12 24 L 12 14 C 12 7.4 17.4 2 24 2 C 30.6 2 36 7.4 36 14 L 36 24" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="24" cy="40" r="5" fill="#0f172a"/>
  </g>
</svg>